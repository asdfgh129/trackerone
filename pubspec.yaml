name: trackerone
description: "TrackerOne - unified background tracking and live fleet monitoring for Traccar."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.0

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.6
  path: ^1.9.0

  # Tracking
  traccar_client_sdk: ^1.1.3
  permission_handler: ^13.0.2
  battery_plus: ^6.2.1
  device_info_plus: ^11.2.0

  # Map & geo
  # 中国大陆首发：高德地图（GCJ-02）。腾讯为备选，接入时新增适配器。
  amap_map: ^1.0.15
  x_amap_base: ^1.0.3
  # 备用纯 Dart 瓦片方案（海外 / 自托管 / 无 Key 环境）
  flutter_map: ^8.1.0
  latlong2: ^0.9.1

  # Platform integration
  app_links: ^7.0.0
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  package_info_plus: ^8.3.0

  # Push
  # 中国大陆生产：极光（聚合小米/华为/OPPO/vivo 厂商通道）
  jpush_flutter: ^3.6.0
  flutter_local_notifications: ^19.0.0
  # 海外 / 开发：Firebase。中国大陆包不要启用。
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  firebase_crashlytics: ^6.0.0
  firebase_analytics: ^13.0.0

  # Formatting
  intl: any
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.28.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
